MaintainerNotes: |-
  Version 1.1 uses a post-release commit adding the FLOSS license grant,
  packaged license notices and Fastlane metadata. The published v1.1 tag
  predates those additions and has not been moved.

  Code is Apache-2.0; the original demo book, illustrations and screenshots
  are CC-BY-4.0. Plyos fonts are OFL-1.1. See docs/licenses.md and NOTICE.

  This is a regular F-Droid-signed build. The upstream 1.1 APK is not
  byte-reproducible from a clean build, so no binary/signing-key constraint
  is included. F-Droid and upstream installations use different signers.

