name: Android quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Build, unit, lint, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run host quality gate
        run: >-
          ./gradlew --stacktrace --continue
          assembleDebug assembleRelease bundleRelease assembleBenchmark test lintRelease
          :feature:reader:validateDebugScreenshotTest
          :feature:library:validateDebugScreenshotTest
          :app:assembleDebugAndroidTest :feature:reader:assembleDebugAndroidTest
          :core:files:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest
          :benchmark:assemble

      - name: Verify release and benchmark optimization
        run: bash .sourcecraft/check-r8.sh release benchmark

      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-results
          if-no-files-found: ignore
          path: |
            **/build/outputs/apk/**
            **/build/outputs/bundle/**
            app/build/outputs/mapping/release/**
            app/build/outputs/mapping/benchmark/**
            **/build/reports/**
            **/build/test-results/**

  instrumented:
    name: API ${{ matrix.api-level }} instrumentation
    needs: host
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            profile: pixel_2
          - api-level: 36
            profile: pixel_7

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          # The action disables animations by default; curl tests need the clock.
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -noaudio
            -camera-back none
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew --stacktrace connectedDebugAndroidTest
            bash scripts/stage9-process-restart.sh "$(adb get-serialno)" build/stage9-process-restart

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results-api-${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            build/stage9-process-restart/**
